# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: "Release"

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            release_type:
                description: "Release bump type"
                required: true
                default: "patch"
                type: "choice"
                options:
                    - "patch"
                    - "minor"
                    - "major"
            version:
                description: "Explicit x.y.z version (overrides release_type)"
                required: false
                type: "string"

concurrency:
    group: "release-${{ github.repository }}"
    cancel-in-progress: false

permissions:
    contents: "write"
    id-token: "write"

defaults:
    run:
        shell: "bash"

jobs:
    publish:
        name: "Publish npm package and GitHub release"
        if: "${{ github.event_name != 'push' || github.actor != 'github-actions[bot]' }}"
        runs-on: "ubuntu-latest"
        timeout-minutes: 60
        steps:
            - name: "Harden runner"
              uses: "step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920" # v2.20.0
              with:
                  egress-policy: "audit"

            - name: "Checkout repository"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
              with:
                  fetch-depth: 0
                  fetch-tags: true

            - name: "Setup Node.js"
              uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020" # v7.0.0
              with:
                  node-version-file: ".node-version"
                  registry-url: "https://registry.npmjs.org"
                  cache: "npm"
                  cache-dependency-path: "package-lock.json"

            - name: "Install npm 12"
              run: "npm install --global npm@12.0.2"

            - name: "Install dependencies without lifecycle scripts"
              run: "npm ci --ignore-scripts"

            - name: "Verify release source"
              run: "npm run release:verify"

            - name: "Configure release Git identity"
              if: "${{ github.event_name == 'workflow_dispatch' }}"
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

            - name: "Determine release version"
              id: "version"
              env:
                  EXPLICIT_VERSION: "${{ inputs.version }}"
                  RELEASE_TYPE: "${{ inputs.release_type }}"
              run: |
                  set -euo pipefail
                  if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
                    if [ "${GITHUB_REF_NAME}" != "main" ]; then
                      echo "Manual releases must run from main, not ${GITHUB_REF_NAME}." >&2
                      exit 1
                    fi
                    if [ -n "${EXPLICIT_VERSION:-}" ]; then
                      if [[ ! "${EXPLICIT_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                        echo "Explicit version must use x.y.z format." >&2
                        exit 1
                      fi
                      npm version "${EXPLICIT_VERSION}" --no-git-tag-version
                    else
                      npm version "${RELEASE_TYPE:-patch}" --no-git-tag-version
                    fi
                  fi

                  version=$(node -p "require('./package.json').version")
                  tag="v${version}"
                  if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_NAME}" != "${tag}" ]; then
                    echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}." >&2
                    exit 1
                  fi
                  echo "version=${version}" >> "${GITHUB_OUTPUT}"
                  echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

            - name: "Check registry availability"
              env:
                  VERSION: "${{ steps.version.outputs.version }}"
              run: |
                  set -euo pipefail
                  if npm view "megalinter-config-nick2bad4u@${VERSION}" version >/dev/null 2>&1; then
                    echo "megalinter-config-nick2bad4u@${VERSION} is already published." >&2
                    exit 1
                  fi

            - name: "Commit and tag manual release"
              if: "${{ github.event_name == 'workflow_dispatch' }}"
              env:
                  TAG: "${{ steps.version.outputs.tag }}"
              run: |
                  set -euo pipefail
                  npm run build
                  git add package.json package-lock.json configs/generated
                  git commit -m "chore: release ${TAG}"
                  git tag -a "${TAG}" -m "${TAG}"
                  git push origin HEAD:main
                  git push origin "${TAG}"

            - name: "Publish to npm with provenance"
              run: "npm publish --access public --provenance --ignore-scripts"

            - name: "Create GitHub release"
              env:
                  GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
                  TAG: "${{ steps.version.outputs.tag }}"
              run: >-
                  gh release create "${TAG}" --generate-notes --title "${TAG}"
