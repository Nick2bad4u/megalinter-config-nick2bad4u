# yaml-language-server: $schema=https://www.schemastore.org/yamllint.json
extends: "default"

ignore: |
    .cache/
    node_modules
    **/node_modules/*
    **/node_modules/**
    dist/
    coverage/
    build/
    release/
    **/.stryker-tmp/**

locale: "en_US.UTF-8"

rules:
    anchors:
        forbid-duplicated-anchors: true
        forbid-undeclared-aliases: true
        forbid-unused-anchors: false

    braces:
        forbid: false
        level: "error"
        max-spaces-inside: 1
        max-spaces-inside-empty: -1

        min-spaces-inside: 0
        min-spaces-inside-empty: -1
    brackets:
        forbid: false

        level: "error"
        max-spaces-inside: 1
        max-spaces-inside-empty: -1
        min-spaces-inside: 0
        min-spaces-inside-empty: -1
    colons:
        level: "error"
        max-spaces-after: 1

        max-spaces-before: 0
    commas:
        level: "error"
        max-spaces-after: 1
        max-spaces-before: 0
        min-spaces-after: 1

    comments:
        ignore-shebangs: true
        level: "warning"
        min-spaces-from-content: 1
        require-starting-space: true
    comments-indentation: "disable"

    document-end: "disable"

    document-start: "disable"
    empty-lines:
        level: "error"
        max: 2
        max-end: 1

        max-start: 1
    empty-values:
        forbid-in-block-mappings: false
        forbid-in-block-sequences: true

        forbid-in-flow-mappings: true
    float-values:
        forbid-inf: false
        forbid-nan: false
        forbid-scientific-notation: false
        require-numeral-before-decimal: false

    hyphens:
        level: "error"
        max-spaces-after: 1

    indentation:
        check-multi-line-strings: false

        indent-sequences: "consistent"
        level: "error"
        spaces: 4
    key-duplicates:
        forbid-duplicated-merge-keys: true
        level: "error"
    key-ordering: "disable"

    line-length: "disable"

    new-line-at-end-of-file: "enable"

    new-lines:
        type: "unix"

    octal-values: "enable"

    quoted-strings:
        allow-quoted-quotes: false
        check-keys: false
        quote-type: "double"
        required: false

    trailing-spaces: "enable"

    truthy:
        allowed-values: ["true", "false"]
        check-keys: false
yaml-files:
    - "*.yaml"
    - "*.yml"
    - ".yamllint"
    - ".yamllint.yaml"
    - ".yamllint.yml"
    - "docker-compose*.yml"
    - "docker-compose*.yaml"
    - "**/*.yaml"
    - "**/*.yml"
