#
# ==============================================================================
# =
# SonarCloud Configuration for megalinter-config-nick2bad4u
#
# ==============================================================================
# =

# Project identification
sonar.organization = nick2bad4u
sonar.projectKey = Nick2bad4u_megalinter-config-nick2bad4u
sonar.projectName = megalinter-config-nick2bad4u

# SonarCloud server configuration
sonar.host.url = https://sonarcloud.io

#
# ==============================================================================
# =
# SOURCE CONFIGURATION
#
# ==============================================================================
# =

# Shipped JavaScript entrypoint and configuration wrappers.
sonar.sources = preset.mjs,configs

# Limit secondary analysis to the real test suite; repo tooling, docs,
# workflows,
# and benchmarks create noise that does not reflect runtime quality.
sonar.tests = test

# Exclude repository tooling, docs, workflows, and generated outputs entirely so
# SonarCloud stays focused on shipped code plus the core test suite.
sonar.exclusions = configs/generated/**

# Exclude non-production code from duplication analysis.
sonar.cpd.exclusions = configs/generated/**

# Restrict test analysis to first-class repository tests only.
sonar.test.inclusions = test/**

# Disable fixtures and snapshots which intentionally contain non-idiomatic code.
sonar.test.exclusions = test/fixtures/**,test/**/snapshots/**

#
# ==============================================================================
# =
# LANGUAGE AND FILE TYPE CONFIGURATION
#
# ==============================================================================
# =

sonar.typescript.file.suffixes = .ts,.tsx,.mts,.cts
sonar.javascript.file.suffixes = .js,.jsx,.mjs,.cjs

# Restrict Sonar's TypeScript program discovery to the root configs that define
# the source/test/tooling surface.
sonar.typescript.tsconfigPaths = tsconfig.typecheck.json

#
# ==============================================================================
# =
# CODE COVERAGE CONFIGURATION
#
# ==============================================================================
# =

sonar.javascript.lcov.reportPaths = coverage/lcov.info

# Ensure no coverage expectations on test files or non-prod folders.
sonar.coverage.exclusions = configs/generated/**

#
# ==============================================================================
# =
# CODE ANALYSIS CONFIGURATION
#
# ==============================================================================
# =

sonar.sourceEncoding = UTF-8
sonar.scm.provider = git
sonar.javascript.detectBundles = true
sonar.qualitygate.wait = true
